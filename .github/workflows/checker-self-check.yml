name: Checker Self Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker
        working-directory: support_tools/python/upd_commander_checker
        run: python -m pip install -e .
      - name: Test
        working-directory: support_tools/python/upd_commander_checker
        run: python -m unittest discover -s tests
      - name: Invalid config fails
        working-directory: support_tools/python/upd_commander_checker
        shell: bash
        run: |
          mkdir -p config
          printf '{ invalid' > config/path.json
          set +e
          output="$(python -m upd_commander_checker . 2>&1)"
          status=$?
          set -e
          rm -rf config
          echo "$output"
          test "$status" -eq 2
          grep -q "CONFIG ERROR:" <<< "$output"
      - name: Self check
        working-directory: support_tools/python/upd_commander_checker
        run: python -m upd_commander_checker . --warnings-as-errors --attentions-as-errors

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test
        working-directory: support_tools/go/upd_commander_checker
        run: go test ./...
      - name: Invalid config fails
        working-directory: support_tools/go/upd_commander_checker
        shell: bash
        run: |
          mkdir -p config
          printf '{ invalid' > config/path.json
          set +e
          output="$(go run ./cmd/upd-commander-check . 2>&1)"
          status=$?
          set -e
          rm -rf config
          echo "$output"
          test "$status" -ne 0
          grep -q "CONFIG ERROR:" <<< "$output"
      - name: Self check
        working-directory: support_tools/go/upd_commander_checker
        run: go run ./cmd/upd-commander-check --warnings-as-errors --attentions-as-errors .

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev llvm-dev
      - name: Configure
        working-directory: support_tools/cpp/upd_commander_checker
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: support_tools/cpp/upd_commander_checker
        run: cmake --build build --config Release
      - name: Test
        working-directory: support_tools/cpp/upd_commander_checker
        run: ctest --test-dir build --output-on-failure
      - name: Invalid config fails
        working-directory: support_tools/cpp/upd_commander_checker
        shell: bash
        run: |
          mkdir -p config
          printf '{ invalid' > config/path.json
          set +e
          output="$(./build/upd-commander-check . 2>&1)"
          status=$?
          set -e
          rm -rf config
          echo "$output"
          test "$status" -eq 2
          grep -q "CONFIG ERROR:" <<< "$output"
      - name: Self check
        working-directory: support_tools/cpp/upd_commander_checker
        run: ./build/upd-commander-check --warnings-as-errors --attentions-as-errors --ignore "build/**" .

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore local tools
        run: dotnet tool restore
      - name: CSharpier check
        run: dotnet csharpier check support_tools/cs
      - name: Build
        working-directory: support_tools/cs/upd_commander_checker
        run: dotnet build UpdCommanderChecker.csproj -c Release
      - name: Unit test
        working-directory: support_tools/cs/upd_commander_checker_tests
        run: dotnet test UpdCommanderChecker.Tests.csproj -c Release
      - name: CLI integration test
        working-directory: support_tools/cs/upd_commander_checker
        shell: bash
        run: |
          target="$(mktemp -d)"
          mkdir -p "$target/applications/main/ui"
          mkdir -p "$target/applications/main/data"
          mkdir -p "$target/applications/main/process"
          mkdir -p "$target/applications/settings/process"
          mkdir -p "$target/data"
          mkdir -p "$target/process"
          cat > "$target/applications/main/data/storage.cs" <<'EOF'
          namespace Applications.Main.Data;
          internal static class Storage
          {
              internal static void Save() { }
          }
          EOF
          cat > "$target/applications/main/ui/screen_processing.cs" <<'EOF'
          using Applications.Main.Data;
          namespace Applications.Main.Ui;
          internal sealed class ScreenProcessing
          {
              internal void Run() => Storage.Save();
          }
          EOF
          cat > "$target/applications/settings/process/settings_processing.cs" <<'EOF'
          namespace Applications.Settings.Process;
          internal static class SettingsProcessing
          {
              internal static void Run() { }
          }
          EOF
          cat > "$target/applications/main/process/main_commander.cs" <<'EOF'
          using Applications.Settings.Process;
          namespace Applications.Main.Process;
          internal sealed class MainCommander
          {
              internal void Run() => SettingsProcessing.Run();
          }
          EOF
          cat > "$target/data/cache_commander.cs" <<'EOF'
          namespace Data;
          internal static class CacheCommander
          {
              internal static void Run() { }
          }
          EOF
          cat > "$target/data/save_commander.cs" <<'EOF'
          namespace Data;
          internal sealed class SaveCommander
          {
              internal void Run() => CacheCommander.Run();
          }
          EOF
          cat > "$target/process/ast_commander.cs" <<'EOF'
          namespace Sample;
          internal sealed class AstCommander
          {
              internal void SafeText(string value)
              {
                  var example = "for (var i = 0; i < 3; i++)";
                  // while (true) must not be treated as syntax.
              }

              internal void NeedsContainer(
                  int left,
                  int right,
                  int mode)
              {
              }
          }
          EOF
          set +e
          output="$(dotnet bin/Release/net8.0/upd-commander-check.dll "$target" 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -q "E UPD101" <<< "$output"
          grep -q "E UPD102" <<< "$output"
          grep -q "W UPD103" <<< "$output"
          grep -q "A UPD301 process/ast_commander.cs" <<< "$output"
          if grep -q "UPD201 process/ast_commander.cs" <<< "$output"; then exit 1; fi
      - name: Invalid config fails
        working-directory: support_tools/cs/upd_commander_checker
        shell: bash
        run: |
          config_path="bin/Release/net8.0/config/path.json"
          cp "$config_path" "$config_path.bak"
          printf '{ invalid' > "$config_path"
          set +e
          output="$(dotnet bin/Release/net8.0/upd-commander-check.dll . 2>&1)"
          status=$?
          set -e
          mv "$config_path.bak" "$config_path"
          echo "$output"
          test "$status" -eq 2
          grep -q "CONFIG ERROR:" <<< "$output"
      - name: Self check
        working-directory: support_tools/cs/upd_commander_checker
        run: dotnet run --project UpdCommanderChecker.csproj -c Release -- --warnings-as-errors --attentions-as-errors .

  license-packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Roslyn and LLVM notices
        shell: pwsh
        run: |
          $roslynOutput = Join-Path $env:RUNNER_TEMP "roslyn-package"
          $llvmOutput = Join-Path $env:RUNNER_TEMP "llvm-package"
          ./support_tools/copy_third_party_licenses.ps1 -Component roslyn -OutputDirectory $roslynOutput
          ./support_tools/copy_third_party_licenses.ps1 -Component llvm -OutputDirectory $llvmOutput
          if (-not (Test-Path "$roslynOutput/THIRD_PARTY_NOTICES.md")) { throw "Roslyn notice missing" }
          if (-not (Test-Path "$roslynOutput/licenses/ROSLYN-LICENSE.txt")) { throw "Roslyn license missing" }
          if (-not (Test-Path "$llvmOutput/THIRD_PARTY_NOTICES.md")) { throw "LLVM notice missing" }
          if (-not (Test-Path "$llvmOutput/licenses/LLVM-LICENSE.txt")) { throw "LLVM license missing" }

  python-windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test CUI and GUI
        working-directory: support_tools/python/upd_commander_checker
        shell: cmd
        run: check_acceptance.bat

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - python
      - go
      - cpp
      - csharp
      - license-packaging
      - python-windows-gui
    if: ${{ always() }}
    steps:
      - name: Require all self-check jobs
        shell: bash
        run: |
          python_result='${{ needs.python.result }}'
          go_result='${{ needs.go.result }}'
          cpp_result='${{ needs.cpp.result }}'
          csharp_result='${{ needs.csharp.result }}'
          license_result='${{ needs.license-packaging.result }}'
          gui_result='${{ needs.python-windows-gui.result }}'
          test "$python_result" = success
          test "$go_result" = success
          test "$cpp_result" = success
          test "$csharp_result" = success
          test "$license_result" = success
          test "$gui_result" = success
