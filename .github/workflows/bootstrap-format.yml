name: Bootstrap Formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'chore/standard-ci-csharpier' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Format Go
        run: gofmt -w support_tools/go/upd_commander_checker
      - name: Restore CSharpier
        run: dotnet tool restore
      - name: Format CSharp
        run: dotnet csharpier format support_tools/cs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add support_tools/go/upd_commander_checker support_tools/cs
          git commit -m "Apply gofmt and CSharpier"
          git push origin "HEAD:${{ github.head_ref }}"
